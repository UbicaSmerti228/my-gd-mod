# Админка сайта: https://app.pagescms.org — войти через GitHub и выбрать этот репозиторий.
# Фото загружаются в site/photos. При публикации они автоматически уменьшаются, геоданные удаляются.

media:
  input: site/photos
  output: photos
  extensions: [jpg, jpeg, png, webp]

content:
  - name: products
    label: Посуда
    type: file
    path: site/content/products.json
    fields:
      - name: items
        label: Вещи
        description: Порядок здесь — порядок на сайте. Проданные сами уходят в конец.
        type: object
        list: true
        fields:
          - name: title
            label: Название
            type: string
            required: true
          - name: photos
            label: Фото
            description: "1-е — вещь одна на бежевом фоне, вертикально. 2-е — в руке, так видно размер (появляется при наведении). Дальше — глазурь, донце."
            type: image
            options:
              multiple: true
          - name: price
            label: Цена, ₽
            type: number
          - name: status
            label: Статус
            type: select
            options:
              values:
                - { value: available, label: В наличии }
                - { value: order, label: Под заказ }
                - { value: reserved, label: Забронировано }
                - { value: sold, label: Продано }
                - { value: hidden, label: Скрыть с сайта }
          - name: size
            label: Размер
            description: "Измерьте линейкой и весами, например: 320 мл, высота 9,5 см"
            type: string
          - name: color
            label: Цвет или глазурь
            type: string
          - name: qty
            label: Сколько штук
            description: Если больше одной, на сайте появится «есть 3 шт.»
            type: number
          - name: description
            label: Пара слов
            type: text
          - name: category
            label: Категория
            description: Например, «кружки». Фильтр по категориям появится, когда вещей станет 12 и больше.
            type: string

  - name: portfolio
    label: Работы
    type: file
    path: site/content/portfolio.json
    fields:
      - name: albums
        label: Подборки
        description: Порядок здесь — порядок на сайте. На главной — первые три подборки по пять фото, остальные — списком.
        type: object
        list: true
        fields:
          - name: title
            label: Название подборки
            type: string
            required: true
          - name: when
            label: Когда
            description: Например, «весна 2026»
            type: string
          - name: text
            label: Пара слов
            type: text
          - name: photos
            label: Фото
            description: Можно загрузить сразу много. Первые пять попадут на главную, первое — крупно.
            type: image
            options:
              multiple: true
          - name: captions
            label: Подписи
            description: Выберите фото из загруженных и напишите подпись. Подписанное фото показывается крупно, подпись стоит рядом.
            type: object
            list: true
            fields:
              - { name: photo, label: Фото, type: image }
              - { name: text, label: Подпись, type: text }

  - name: giveaways
    label: Розыгрыши
    type: file
    path: site/content/giveaways.json
    fields:
      - name: items
        label: Розыгрыши
        description: Статус меняется сам по датам. После даты итогов розыгрыш уходит в «Прошлые».
        type: object
        list: true
        fields:
          - { name: title, label: Что разыгрываете, type: string, required: true }
          - { name: photo, label: Фото приза, type: image }
          - { name: start, label: Начало, type: date }
          - { name: end, label: Последний день, type: date }
          - { name: results, label: Дата итогов, type: date }
          - name: conditions
            label: Условия
            description: Одно условие на строку.
            type: text
          - { name: how, label: Как выбираете победителя, type: text }
          - { name: link, label: Ссылка на пост, type: string }
          - { name: winner, label: Победитель, description: Заполните после итогов, type: string }
          - { name: draft, label: Черновик, description: Пока включено, розыгрыш виден только по адресу сайта с #preview в конце, type: boolean }

  - name: site
    label: Сайт
    type: file
    path: site/content/site.json
    fields:
      - name: demo
        label: Показывать примеры
        description: Пока включено, в пустых разделах видны рамки-примеры. Выключите, когда заполните сайт.
        type: boolean
      - { name: name, label: Название мастерской или ваше имя, type: string }
      - { name: tagline, label: Строка под главным фото, type: string }
      - name: background
        label: Фон сайта
        description: Выберите тон, ближайший к фону, на котором вы снимаете.
        type: select
        options:
          values:
            - { value: linen, label: Лён }
            - { value: sand, label: Песок }
            - { value: grey, label: Серый беж }
      - name: hero
        label: Главное фото
        type: object
        fields:
          - name: photos
            label: Фото
            description: Одно горизонтальное или два рядом.
            type: image
            options:
              multiple: true
          - name: focus
            label: Что важнее в кадре
            type: select
            options:
              values:
                - { value: center, label: Середина }
                - { value: top, label: Верх }
                - { value: bottom, label: Низ }
      - name: contacts
        label: Контакты
        description: Пустые поля на сайте не показываются.
        type: object
        fields:
          - { name: telegram, label: Telegram для заказов (ник), type: string }
          - { name: channel, label: Telegram-канал (ник), type: string }
          - { name: vk, label: ВКонтакте (адрес страницы после vk.com/), type: string }
          - { name: whatsapp, label: WhatsApp (номер), type: string }
          - { name: phone, label: Телефон, type: string }
          - { name: email, label: Почта, type: string }
      - name: delivery
        label: Как получить
        type: object
        list: true
        fields:
          - { name: name, label: Способ, type: string }
          - { name: place, label: Адрес (для самовывоза), type: string }
          - { name: price, label: Цена, description: "Например: 350 ₽", type: string }
          - { name: time, label: Срок, description: "Например: 5–10 дней", type: string }
          - { name: text, label: Как это работает, type: text }
          - { name: send, label: Что прислать вам, type: string }
      - name: texts
        label: Тексты
        description: Пустые на сайте не показываются.
        type: object
        fields:
          - { name: about, label: О себе, type: text }
          - { name: payment, label: Оплата, type: text }
          - { name: packaging, label: Упаковка, type: text }
          - { name: care, label: Уход, type: text }
