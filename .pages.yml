# Админка сайта: https://app.pagescms.org — войти через GitHub и выбрать этот репозиторий.
# Здесь описано, какие поля можно править. Фото загружаются в site/photos.

media:
  input: site/photos
  output: photos
  extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: portfolio
    label: Портфолио
    type: file
    path: site/content/portfolio.json
    fields:
      - name: albums
        label: Подборки (порядок здесь = порядок на сайте)
        type: object
        list: true
        fields:
          - name: id
            label: Короткое имя латиницей, без пробелов (например, utro или kiln-48)
            type: string
            required: true
          - name: title
            label: Название подборки
            type: string
            required: true
          - name: kind
            label: Тип
            type: select
            options:
              values:
                - { value: series, label: Серия }
                - { value: kiln, label: Открытие печи }
                - { value: cafe, label: Для кафе }
                - { value: process, label: Мастерская }
          - name: date
            label: Дата
            type: date
          - name: text
            label: Пара предложений о подборке
            type: text
          - name: cover
            label: Обложка (если пусто — первое фото)
            type: image
          - name: photos
            label: Фото с подписями
            type: object
            list: true
            fields:
              - name: src
                label: Фото
                type: image
                required: true
              - name: caption
                label: Подпись
                type: string
          - name: gallery
            label: Быстрая загрузка — много фото без подписей (покажутся после подписанных)
            type: image
            options:
              multiple: true

  - name: giveaways
    label: Розыгрыши
    type: file
    path: site/content/giveaways.json
    fields:
      - name: items
        label: Розыгрыши (новый — первым в списке)
        type: object
        list: true
        fields:
          - { name: id, label: Короткое имя латиницей, type: string, required: true }
          - { name: title, label: Название, type: string, required: true }
          - { name: prize, label: Что разыгрываю, type: text }
          - { name: image, label: Фото приза, type: image }
          - { name: start, label: Начало, type: date }
          - { name: end, label: Итоги, type: date }
          - { name: conditions, label: Условия (по одному на строку), type: string, list: true }
          - { name: how, label: Как выбираю победителя, type: text }
          - { name: rules, label: Мелкий шрифт, type: text }
          - { name: link, label: Ссылка на пост, type: string }
          - { name: winner, label: Победитель (заполнить после итогов), type: string }

  - name: shop
    label: Наличие, обжиги и доставка
    type: file
    path: site/content/shop.json
    fields:
      - name: studio
        label: Мастерская и контакты
        type: object
        fields:
          - { name: name, label: Название, type: string }
          - { name: city, label: Город, type: string }
          - { name: cityIn, label: Город в предложном падеже (в Иркутске), type: string }
          - { name: telegram, label: Telegram без @, type: string }
          - { name: email, label: Почта, type: string }
          - { name: phone, label: Телефон, type: string }
      - name: delivery
        label: Доставка и самовывоз
        type: object
        fields:
          - { name: pickupAddress, label: Адрес самовывоза, type: string }
          - { name: pickupNote, label: Условия самовывоза, type: text }
          - name: options
            label: Способы доставки
            type: object
            list: true
            fields:
              - { name: id, label: Код латиницей, type: string }
              - { name: name, label: Название, type: string }
              - { name: price, label: Цена числом (0 — если зависит от заказа), type: number }
              - { name: priceText, label: Цена текстом, type: string }
              - { name: time, label: Срок, type: string }
              - { name: text, label: Как работает, type: text }
              - { name: askPoint, label: Спрашивать адрес пункта выдачи, type: boolean }
      - name: firing
        label: Текущий обжиг (то, что в продаже)
        type: object
        fields:
          - { name: no, label: Номер, type: number }
          - { name: opened, label: Дата открытия печи, type: date }
          - { name: loaded, label: Загружено предметов, type: number }
          - { name: rejects, label: Брак, type: number }
      - name: next
        label: Следующий обжиг (предзаказ)
        type: object
        fields:
          - { name: no, label: Номер, type: number }
          - { name: deadline, label: Последний день предзаказа, type: date }
          - { name: loading, label: Загрузка, type: date }
          - { name: firing, label: Обжиг, type: date }
          - { name: opening, label: Открытие, type: date }
      - name: forms
        label: Формы посуды
        type: object
        list: true
        fields:
          - { name: id, label: Код латиницей (mug, bowl…), type: string, required: true }
          - { name: name, label: Название, type: string, required: true }
          - name: cat
            label: Тип
            type: select
            options:
              values:
                - { value: cups, label: Кружки и стаканы }
                - { value: bowls, label: Миски и пиалы }
                - { value: plates, label: Тарелки и блюда }
                - { value: jugs, label: Молочники }
          - { name: handle, label: С ручкой, type: boolean }
          - { name: use, label: Для чего и чем удобна, type: text }
          - { name: volume, label: Объём, мл (0 — для тарелок), type: number }
          - { name: d, label: Диаметр, см, type: number }
          - { name: h, label: Высота, см, type: number }
          - { name: weight, label: Вес, г, type: number }
          - { name: price, label: Цена, ₽, type: number }
          - { name: made, label: Вышло из печи в текущем обжиге, type: number }
          - { name: slotsTotal, label: Мест на предзаказ в следующий обжиг, type: number }
          - { name: slotsTaken, label: Из них занято, type: number }
          - name: variants
            label: Глазури и остаток
            type: object
            list: true
            fields:
              - name: glaze
                label: Глазурь
                type: select
                options:
                  values:
                    - { value: milk, label: Топлёное молоко }
                    - { value: oat, label: Овсянка }
                    - { value: sugar, label: Жжёный сахар }
                    - { value: ash, label: Пепел }
                    - { value: rye, label: Ржаная корка }
              - { name: stock, label: В наличии, шт., type: number }
          - name: photos
            label: Фото предмета
            type: image
            options:
              multiple: true
      - name: log
        label: Журнал обжигов (новый — первым)
        type: object
        list: true
        fields:
          - { name: no, label: Номер, type: number }
          - { name: opened, label: Открыт, type: date }
          - { name: loaded, label: Загружено, type: number }
          - { name: rejects, label: Брак, type: number }
          - { name: left, label: В наличии сейчас, type: number }
          - { name: note, label: Что было, type: text }
