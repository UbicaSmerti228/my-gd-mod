name: Publish site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      - run: node tools/build-site.mjs
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Save optimized originals
        run: |
          if [ -n "$(git status --porcelain -- site/photos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/photos
            git commit -m "Фото: уменьшены до 2000 px, геоданные удалены"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
