name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

          - name: iOS
            os: macos-latest
            target: iOS

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: ILL Replay Bot
          path: ${{ steps.build.outputs.build-output }}

      # A direct download link that works on any device, without logging in:
      # the "latest-build" pre-release always holds the newest .geode.
      - name: Publish the latest build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          target_commitish: ${{ github.sha }}
          name: ILL Replay Bot (latest build)
          body: |
            Newest build of branch ${{ github.ref_name }} (commit ${{ github.sha }}).
            Download the .geode file below and put it into the geode/mods folder of the game.
          prerelease: true
          make_latest: false
          files: ${{ steps.build.outputs.build-output }}/*.geode
